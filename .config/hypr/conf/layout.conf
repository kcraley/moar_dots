# Configuring Dwindle and Master Layouts.
# https://wiki.hypr.land/Configuring/Dwindle-Layout
# https://wiki.hypr.land/Configuring/Master-Layout

dwindle {
    # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybindsings.
    pseudotile = true

    preserve_split = true
}

master {
    new_status = master
}
