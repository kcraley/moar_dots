# Reorder Workspaces to match monitor orientation.
# https://wiki.hypr.land/Configuring/Window-Rules/
# https://wiki.hypr.land/Configuring/Workspace-Rules/

workspace = 1, default:true, monitor:DP-2
workspace = 2, default:true, monitor:DP-1
workspace = 3, default:true, monitor:DP-3
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-1
workspace = 3, monitor:DP-3
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-3
workspace = 0, monitor:DP-2

# "Smart gaps" / "No gaps when only"
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# Ignore maximize requests from applications.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging isssues with XWayland.
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
