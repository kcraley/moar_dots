# Hyprlock configuration.
$font_icons = Mononoki Mono Nerd Font Propo
$font_timedate = CodeNewRoman Nerd Font Propo
$monitor = DP-1

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blue_size = 10
    noise = 0.02
    contrast = 0.914
    vibrancy = 0.245
}

# Day
label {
    monitor = $monitor
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = rgb(f8f8f2)
    font_size = 90
    font_family = $font_timedate
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor = $monitor
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgb(f8f8f2)
    font_size = 40
    font_family = $font_timedate
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor = $monitor
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = rgb(f8f8f2)
    font_size = 20
    font_family = $font_timedate
    position = 0, 190
    halign = center
    valign = center
}

# Profie-Photo
image {
    monitor = $monitor
    path = $HOME/Pictures/profile.jpg
    border_size = 2
    border_color = rgb(fbdfb5)
    size = 130
    shadow_passes = 1
    shadow_size = 10
    shadow_boost = 1
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 40
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor = $monitor
    size = 300, 60
    color = rgb(515151)
    rounding = -1
    border_size = 2
    border_color = rgb(fbdfb5)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -130
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 10
    shadow_boost = 1
}

# USER
label {
    monitor = $monitor
    text = <span>  $USER</span>
    color = rgb(f8f8f2)
    outline_thickness = 2
    font_size = 18
    font_family = $font_timedate
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor = $monitor
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(fbdfb5)
    inner_color = rgb(515151)
    font_color = rgb(fdb082)
    check_color = rgb(ffb2f9)
    fail_color = rgb(ff5e5e)
    fail_text = Incorrect Password
    fade_on_empty = false
    font_family = $font_timedate
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0, -210
    shadow_passes = 1
    shadow_size = 10
    shadow_boost = 1
    halign = center
    valign = center
}

# Reboot
label {
    monitor = $monitor
    text = <span>  </span>
    color = rgb(e0fdac)
    font_size = 40
    font_family = $font
    onclick = reboot now
    position = -8%, 15%
    halign = center
    valign = bottom
}

# Power off
label {
    monitor = $monitor
    text = <span>  </span>
    color = rgb(ff5e5e)
    font_size = 40
    font_family = $font
    onclick = shutdown now
    position = 0%, 15%
    halign = center 
    valign = bottom
}

# Suspend
label {
    monitor = $monitor
    text = <span> 󰤄 </span>
    color = rgb(6699cc)
    font_size = 40
    font_family = $font
    onclick = systemctl suspend
    position = 8%, 15%
    halign = center
    valign = bottom
    halign = center
}
